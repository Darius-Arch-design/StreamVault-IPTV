name: Android Beta Build
# Run Stalker regression tests before packaging each beta.
# Beta Android TV validation build for Stalker search and category fixes.

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-beta:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          BASE_VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          SHORT_SHA="${GITHUB_SHA::7}"
          BETA_SEQUENCE=$(printf "%06d.%02d" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT")
          BETA_VERSION_CODE=$((BASE_VERSION_CODE + GITHUB_RUN_NUMBER))
          BETA_VERSION_NAME="$VERSION_NAME-beta.$BETA_SEQUENCE"

          if [ -z "$VERSION_NAME" ] || [ -z "$BASE_VERSION_CODE" ]; then
            echo "Failed to read app version from app/build.gradle.kts"
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "beta_version_name=$BETA_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "beta_version_code=$BETA_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "beta_sequence=$BETA_SEQUENCE" >> "$GITHUB_OUTPUT"
          echo "beta_tag=v$BETA_VERSION_NAME+$BETA_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_name=StreamVault-$BETA_VERSION_NAME.apk" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare stable beta signing files
        shell: bash
        env:
          BETA_KEYSTORE_BASE64: ${{ secrets.BETA_KEYSTORE_BASE64 }}
          BETA_STORE_PASSWORD: ${{ secrets.BETA_STORE_PASSWORD }}
          BETA_KEY_ALIAS: ${{ secrets.BETA_KEY_ALIAS }}
          BETA_KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
        run: |
          if [ -z "$BETA_KEYSTORE_BASE64" ] || [ -z "$BETA_STORE_PASSWORD" ] || [ -z "$BETA_KEY_ALIAS" ] || [ -z "$BETA_KEY_PASSWORD" ]; then
            echo '::error::Stable beta signing secrets are missing. Refusing a disposable debug-signed APK that cannot update an installed beta.'
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$BETA_KEYSTORE_BASE64" | base64 --decode > keystore/beta.jks
          printf '%s\n' \
            'storeFile=keystore/beta.jks' \
            "storePassword=$BETA_STORE_PASSWORD" \
            "keyAlias=$BETA_KEY_ALIAS" \
            "keyPassword=$BETA_KEY_PASSWORD" \
            > keystore.properties
          keytool -list -keystore keystore/beta.jks -storepass "$BETA_STORE_PASSWORD" -alias "$BETA_KEY_ALIAS" > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run playback and Stalker regression tests
        run: |
          ./gradlew --console=plain :player:testDebugUnitTest \
            --tests 'com.streamvault.player.ExternalSubtitlePlaybackTest'
          ./gradlew --console=plain :feature:playback:testDebugUnitTest \
            --tests 'com.streamvault.feature.playback.player.PlayerExternalSubtitleCoordinatorTest' \
            --tests 'com.streamvault.feature.playback.player.PlayerExternalSubtitlePickerLabelTest' \\
            --tests 'com.streamvault.feature.playback.player.PlayerAutomaticSubtitlePolicyTest'
          ./gradlew --console=plain :domain:test --tests 'com.streamvault.domain.usecase.SearchContentTest'
          ./gradlew --console=plain :data:testDebugUnitTest \
            --tests 'com.streamvault.data.sync.SyncManagerTest.sync_stalker_does_not_restart_pending_index_when_category_shell_is_fresh' \
            --tests 'com.streamvault.data.sync.SyncManagerTest.sync_stalker_rechecks_bulk_when_cached_category_mapping_came_from_old_parser' \
            --tests 'com.streamvault.data.sync.SyncManagerTest.sync_stalker_falls_back_when_bulk_channels_have_no_category_ids' \
            --tests 'com.streamvault.data.remote.stalker.StalkerProviderTest' \
            --tests 'com.streamvault.data.remote.stalker.OkHttpStalkerApiServiceTest' \
            --tests 'com.streamvault.data.repository.SearchRepositoryImplTest' \
            --tests 'com.streamvault.data.repository.VodRepositoryImplTest' \
            --tests 'com.streamvault.data.repository.TitloviExternalSubtitleRepositoryTest'
          ./gradlew --console=plain :feature:settings:testDebugUnitTest \
            --tests 'com.streamvault.feature.settings.presentation.SettingsPreferencesContractTest'
          ./gradlew --console=plain :app:testDebugUnitTest \
            --tests 'com.streamvault.app.ui.screens.settings.SettingsAppUpdateModelsTest' \
            --tests 'com.streamvault.app.update.GitHubReleaseCheckerTest' \
            --tests 'com.streamvault.app.update.AppUpdateInstallerIntentTest'

      - name: Build beta APK
        run: ./gradlew --console=plain -PappVersionCode="${{ steps.app_version.outputs.beta_version_code }}" -PappVersionName="${{ steps.app_version.outputs.beta_version_name }}" :app:assembleBeta

      - name: Prepare beta artifact
        shell: bash
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/beta -maxdepth 1 -name '*.apk' | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "No beta APK produced."
            exit 1
          fi

          cp "$APK_PATH" "dist/${{ steps.app_version.outputs.apk_name }}"
          cp "$APK_PATH" dist/StreamVault-beta.apk

      - name: Upload beta APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta-apk
          path: |
            dist/${{ steps.app_version.outputs.apk_name }}
            dist/StreamVault-beta.apk

  publish-beta:
    needs: build-beta
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          BASE_VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          SHORT_SHA="${GITHUB_SHA::7}"
          BETA_SEQUENCE=$(printf "%06d.%02d" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT")
          BETA_VERSION_CODE=$((BASE_VERSION_CODE + GITHUB_RUN_NUMBER))
          BETA_VERSION_NAME="$VERSION_NAME-beta.$BETA_SEQUENCE"

          if [ -z "$VERSION_NAME" ] || [ -z "$BASE_VERSION_CODE" ]; then
            echo "Failed to read app version from app/build.gradle.kts"
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "beta_version_name=$BETA_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "beta_version_code=$BETA_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "beta_sequence=$BETA_SEQUENCE" >> "$GITHUB_OUTPUT"
          echo "beta_tag=v$BETA_VERSION_NAME+$BETA_VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Download beta APK artifact
        uses: actions/download-artifact@v4
        with:
          name: beta-apk
          path: dist

      - name: Publish GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.beta_tag }}
          target_commitish: ${{ github.sha }}
          name: StreamVault Beta ${{ steps.app_version.outputs.version_name }} build ${{ steps.app_version.outputs.beta_sequence }}
          body: |
            Automated beta build from `develop`.

            Beta sequence: `${{ steps.app_version.outputs.beta_sequence }}`
            Commit: `${{ github.sha }}`
          files: |
            dist/*.apk
          prerelease: true
          make_latest: false
          generate_release_notes: false
