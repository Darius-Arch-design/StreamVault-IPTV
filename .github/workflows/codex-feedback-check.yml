name: Verify Stalker beta feedback

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'feature/provider/src/main/java/com/streamvault/feature/provider/pairing/ProviderQrPairingManager.kt'
      - 'data/src/main/java/com/streamvault/data/sync/StalkerCatalogSyncExecutor.kt'
      - 'data/src/main/java/com/streamvault/data/sync/ProviderSyncWorker.kt'
      - 'data/src/test/java/com/streamvault/data/sync/SyncManagerTest.kt'
      - 'data/src/test/java/com/streamvault/data/sync/ProviderSyncWorkerTest.kt'
      - 'domain/src/main/java/com/streamvault/domain/repository/ExternalSubtitleRepository.kt'
      - 'data/src/main/java/com/streamvault/data/repository/TitloviExternalSubtitleRepository.kt'
      - 'data/src/test/java/com/streamvault/data/repository/TitloviExternalSubtitleRepositoryTest.kt'
      - 'data/src/main/java/com/streamvault/data/manager/GoogleDriveBackupSyncManager.kt'
      - 'data/src/test/java/com/streamvault/data/manager/GoogleDriveBackupSyncManagerTest.kt'
      - 'domain/src/main/java/com/streamvault/domain/manager/DriveBackupSyncManager.kt'
      - 'feature/settings/src/main/java/com/streamvault/feature/settings/presentation/**'
      - 'feature/settings/src/test/java/com/streamvault/feature/settings/presentation/SettingsDriveBackupActionsTest.kt'
      - 'feature/settings/src/main/res/values/strings.xml'
      - 'feature/playback/src/test/java/com/streamvault/feature/playback/player/PlayerExternalSubtitleCoordinatorTest.kt'
      - '.github/workflows/codex-feedback-check.yml'

permissions:
  contents: read

jobs:
  targeted-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile QR pairing feature
        run: ./gradlew --console=plain :feature:provider:compileDebugKotlin
      - name: Run Stalker sync regression tests
        run: |
          ./gradlew --console=plain :data:testDebugUnitTest \
            --tests 'com.streamvault.data.sync.SyncManagerTest.sync_stalker_keeps_large_interrupted_bulk_import_without_refetching_every_category' \
            --tests 'com.streamvault.data.sync.SyncManagerTest.sync_stalker_does_not_restart_pending_index_when_category_shell_is_fresh' \
            --tests 'com.streamvault.data.sync.SyncManagerTest.sync_stalker_rechecks_bulk_when_cached_category_mapping_came_from_old_parser' \
            --tests 'com.streamvault.data.sync.SyncManagerTest.sync_stalker_falls_back_when_bulk_channels_have_no_category_ids' \
            --tests 'com.streamvault.data.sync.ProviderSyncWorkerTest.failed Stalker continuation keeps its playable bootstrap catalog active'
      - name: Compile subtitle account settings
        run: ./gradlew --console=plain :feature:settings:compileDebugKotlin
      - name: Run Titlovi authentication and player tests
        run: |
          ./gradlew --console=plain :data:testDebugUnitTest \
            --tests 'com.streamvault.data.repository.TitloviExternalSubtitleRepositoryTest'
          ./gradlew --console=plain :feature:playback:testDebugUnitTest \
            --tests 'com.streamvault.feature.playback.player.PlayerExternalSubtitleCoordinatorTest'
      - name: Run Google Drive backup tests
        run: |
          ./gradlew --console=plain :data:testDebugUnitTest \
            --tests 'com.streamvault.data.manager.GoogleDriveBackupSyncManagerTest'
          ./gradlew --console=plain :feature:settings:testDebugUnitTest \
            --tests 'com.streamvault.feature.settings.presentation.SettingsDriveBackupActionsTest'
