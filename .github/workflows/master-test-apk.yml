name: StreamVault Master Test APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamvault-master-apk
  cancel-in-progress: true

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out master
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable debug APK
        run: |
          chmod +x gradlew
          ./gradlew --console=plain --stacktrace :app:assembleDebug

      - name: Run focused catalog and playback tests
        run: ./gradlew --console=plain :data:testDebugUnitTest :feature:playback:testDebugUnitTest

      - name: Upload signed test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamvault-master-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamvault-master-test-reports
          path: |
            data/build/test-results/
            feature/playback/build/test-results/
            data/build/reports/tests/
            feature/playback/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
