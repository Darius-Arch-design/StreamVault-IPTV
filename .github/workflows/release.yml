name: Android CI and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.app_version.outputs.version_name }}
      version_code: ${{ steps.app_version.outputs.version_code }}
      release_tag: ${{ steps.app_version.outputs.release_tag }}
      apk_name: ${{ steps.app_version.outputs.apk_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Failed to read app version from app/build.gradle.kts"
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=StreamVault-$VERSION_NAME.apk" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare required release signing files
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          BETA_KEYSTORE_BASE64: ${{ secrets.BETA_KEYSTORE_BASE64 }}
          BETA_STORE_PASSWORD: ${{ secrets.BETA_STORE_PASSWORD }}
          BETA_KEY_ALIAS: ${{ secrets.BETA_KEY_ALIAS }}
          BETA_KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            SIGNING_KEYSTORE_BASE64="$RELEASE_KEYSTORE_BASE64"
            SIGNING_STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
            SIGNING_KEY_ALIAS="$RELEASE_KEY_ALIAS"
            SIGNING_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          elif [ -n "$BETA_KEYSTORE_BASE64" ] && [ -n "$BETA_STORE_PASSWORD" ] && [ -n "$BETA_KEY_ALIAS" ] && [ -n "$BETA_KEY_PASSWORD" ]; then
            echo "Using the persistent signing key already used by the beta channel."
            SIGNING_KEYSTORE_BASE64="$BETA_KEYSTORE_BASE64"
            SIGNING_STORE_PASSWORD="$BETA_STORE_PASSWORD"
            SIGNING_KEY_ALIAS="$BETA_KEY_ALIAS"
            SIGNING_KEY_PASSWORD="$BETA_KEY_PASSWORD"
          else
            echo '::error::Release signing secrets are missing. Refusing to publish an unsigned APK.'
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          printf '%s\n' \
            'storeFile=keystore/release.jks' \
            "storePassword=$SIGNING_STORE_PASSWORD" \
            "keyAlias=$SIGNING_KEY_ALIAS" \
            "keyPassword=$SIGNING_KEY_PASSWORD" \
            > keystore.properties
          keytool -list -keystore keystore/release.jks -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" > /dev/null
          keytool -exportcert -keystore keystore/release.jks -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" \
            | sha256sum | awk '{print toupper($1)}' > keystore/release-cert-sha256
          echo "Persistent release signing key is ready."

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test CI helper scripts
        shell: bash
        run: |
          for test_script in tools/tests/*-test.sh; do
            bash "$test_script"
          done

      - name: Run unit tests, lint, and coverage
        run: ./gradlew --console=plain testDebugUnitTest :app:lintDebug :data:lintDebug :player:lintDebug verifyLintBaseline koverXmlReportCi koverHtmlReportCi

      - name: Compile instrumentation release gates
        run: ./gradlew --console=plain :app:assembleDebugAndroidTest :data:assembleDebugAndroidTest

      - name: Build release APK
        run: ./gradlew --console=plain :app:assembleRelease

      - name: Verify release APK signature
        shell: bash
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APK_PATH" ] || [ -z "$APKSIGNER" ]; then
            echo '::error::Release APK or apksigner was not found.'
            exit 1
          fi
          VERIFY_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")
          printf '%s\n' "$VERIFY_OUTPUT"
          EXPECTED_CERT_SHA256=$(tr -d '[:space:]' < keystore/release-cert-sha256)
          ACTUAL_CERT_SHA256=$(printf '%s\n' "$VERIFY_OUTPUT" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {gsub(":", "", $2); print toupper($2)}')
          if [ -z "$ACTUAL_CERT_SHA256" ] || [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo '::error::Release APK signature does not match the persistent signing key.'
            exit 1
          fi
          echo "Release APK signature verified."

      - name: Prepare release artifact
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No release APK produced."
            exit 1
          fi
          cp "$APK_PATH" "dist/${{ steps.app_version.outputs.apk_name }}"
          cp "$APK_PATH" dist/StreamVault.apk

      - name: Upload release APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            dist/${{ steps.app_version.outputs.apk_name }}
            dist/StreamVault.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            data/build/reports/tests/
            domain/build/reports/tests/
            player/build/reports/tests/

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            build/reports/kover/

  publish-release:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, platform-smoke]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: dist

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Failed to read app version from app/build.gradle.kts"
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=StreamVault-$VERSION_NAME.apk" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        id: changelog
        shell: bash
        run: |
          VERSION="${{ steps.app_version.outputs.version_name }}"
          echo "Extracting notes for version $VERSION"
          
          # Extract lines between the header and the next header (or EOF)
          # Supports both "## [1.0.5] - date" and legacy "## 1.0.5 date" styles.
          {
            echo "notes<<EOF"
            awk -v ver="$VERSION" '
              $0 ~ ("^## \\[" ver "\\]") || $0 ~ ("^## " ver " ") { p=1; next }
              $0 ~ "^## " && p { p=0 }
              p { print }
            ' docs/CHANGELOG.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.release_tag }}
          name: StreamVault ${{ steps.app_version.outputs.version_name }}
          body: |
            ${{ steps.changelog.outputs.notes }}
            
            ---
            Built from `${{ github.sha }}`.
          files: |
            dist/${{ steps.app_version.outputs.apk_name }}
            dist/StreamVault.apk
          make_latest: true
          generate_release_notes: false

  platform-smoke:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/platform-smoke.yml
